workflows:
  ios-testflight:
    name: RevierAI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: revierai-apple

    environment:
      node: 22
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.revierai.app
      vars:
        APP_STORE_APPLE_ID: "6793937670"
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Check project
        script: |
          set -euo pipefail
          test -f package.json
          test -f capacitor.config.ts
          test -f www/index.html

      - name: Install dependencies
        script: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npx cap --version

      - name: Create iOS project
        script: |
          set -euo pipefail
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          test -d ios/App/App.xcodeproj
          test -f ios/App/App/Info.plist

      - name: Install app icon
        script: |
          set -euo pipefail
          if [ -f scripts/install-ios-icon.sh ] && [ -f resources/icon-1024.png ]; then
            chmod +x scripts/install-ios-icon.sh
            scripts/install-ios-icon.sh
          fi

      - name: Add iOS permissions
        script: |
          set -euo pipefail
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string RevierAI benoetigt die Kamera fuer Wildbeobachtungen." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string RevierAI benoetigt Zugriff auf ausgewaehlte Fotos." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string RevierAI darf Bilder in der Fotomediathek speichern." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string RevierAI verwendet den Standort fuer Beobachtungspunkte." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string RevierAI verwendet das Mikrofon fuer Spracheingaben." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || true

      - name: Configure signing
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Set next Apple build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=0
          fi
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Latest Apple build: $LATEST_BUILD_NUMBER"
          echo "Next build: $NEXT_BUILD_NUMBER"
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Build IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Check IPA
        script: |
          set -euo pipefail
          IPA_PATH=$(find "$CM_BUILD_DIR" -type f -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found"
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          if [ "$IPA_PATH" != "$CM_BUILD_DIR/build/ios/ipa/RevierAI.ipa" ]; then
            cp "$IPA_PATH" "$CM_BUILD_DIR/build/ios/ipa/RevierAI.ipa"
          fi
          ls -lh "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
        submit_to_app_store: false
