workflows:
  ios-testflight:
    name: RevierAI iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: revierai-apple

    environment:
      node: 22
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.revierai.app
      vars:
        APP_STORE_APPLE_ID: "6793937670"
        APP_VERSION: "1.0"
        BUILD_OFFSET: "1000"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - "$HOME/.npm"

    scripts:
      - name: Check project
        script: |
          set -euo pipefail
          pwd
          ls -la
          test -f package.json
          test -f capacitor.config.ts
          test -f www/index.html

      - name: Install dependencies
        script: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npx cap --version

      - name: Embed map and AI libraries
        script: |
          set -euo pipefail
          mkdir -p www/vendor/leaflet/images www/vendor/ai
          cp node_modules/leaflet/dist/leaflet.js www/vendor/leaflet/leaflet.js
          cp node_modules/leaflet/dist/leaflet.css www/vendor/leaflet/leaflet.css
          cp node_modules/leaflet/dist/images/* www/vendor/leaflet/images/
          cp node_modules/@tensorflow/tfjs/dist/tf.min.js www/vendor/ai/tf.min.js
          cp node_modules/@tensorflow-models/mobilenet/dist/mobilenet.min.js www/vendor/ai/mobilenet.min.js
          test -f www/vendor/leaflet/leaflet.js
          test -f www/vendor/ai/tf.min.js
          test -f www/vendor/ai/mobilenet.min.js

      - name: Create iOS project
        script: |
          set -euo pipefail
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          test -d "$CM_BUILD_DIR/$XCODE_PROJECT"
          test -f "$CM_BUILD_DIR/ios/App/App/Info.plist"

      - name: Install app icon
        script: |
          set -euo pipefail
          if [ -f scripts/install-ios-icon.sh ] && [ -f resources/icon-1024.png ]; then
            chmod +x scripts/install-ios-icon.sh
            scripts/install-ios-icon.sh
          fi

      - name: Add iOS permissions
        script: |
          set -euo pipefail
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string RevierAI benoetigt die Kamera fuer Wildbeobachtungen." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string RevierAI benoetigt Zugriff auf ausgewaehlte Fotos." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string RevierAI darf Bilder in der Fotomediathek speichern." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string RevierAI verwendet den Standort fuer Beobachtungspunkte." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string RevierAI verwendet das Mikrofon fuer Spracheingaben." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || true

      - name: Configure signing
        script: |
          set -euo pipefail
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Set unique Xcode build number
        script: |
          set -euo pipefail

          APP_BUILD_NUMBER=$((BUILD_OFFSET + BUILD_NUMBER))
          PROJECT_FILE="$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"

          echo "Codemagic build number: $BUILD_NUMBER"
          echo "Apple build number: $APP_BUILD_NUMBER"

          python3 - "$PROJECT_FILE" "$APP_BUILD_NUMBER" "$APP_VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          project_file = Path(sys.argv[1])
          build_number = sys.argv[2]
          app_version = sys.argv[3]

          text = project_file.read_text(encoding="utf-8")

          text, build_count = re.subn(
              r"CURRENT_PROJECT_VERSION\s*=\s*[^;]+;",
              f"CURRENT_PROJECT_VERSION = {build_number};",
              text,
          )
          text, version_count = re.subn(
              r"MARKETING_VERSION\s*=\s*[^;]+;",
              f"MARKETING_VERSION = {app_version};",
              text,
          )

          if build_count == 0:
              raise SystemExit("CURRENT_PROJECT_VERSION was not found in project.pbxproj")

          if version_count == 0:
              raise SystemExit("MARKETING_VERSION was not found in project.pbxproj")

          project_file.write_text(text, encoding="utf-8")
          print(f"Updated CURRENT_PROJECT_VERSION in {build_count} places")
          print(f"Updated MARKETING_VERSION in {version_count} places")
          PY

          echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" >> "$CM_ENV"

          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -showBuildSettings |
            grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION" |
            head -n 10

      - name: Build IPA with forced build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$APP_BUILD_NUMBER MARKETING_VERSION=$APP_VERSION"

      - name: Verify IPA build number
        script: |
          set -euo pipefail

          SOURCE_IPA=$(find "$CM_BUILD_DIR" -type f -name "*.ipa" ! -path "$CM_BUILD_DIR/publish/*" | head -n 1)

          if [ -z "$SOURCE_IPA" ]; then
            echo "No IPA was created."
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/publish"
          mkdir -p "$CM_BUILD_DIR/publish"
          cp "$SOURCE_IPA" "$CM_BUILD_DIR/publish/RevierAI.ipa"

          rm -rf /tmp/revierai-ipa-check
          mkdir -p /tmp/revierai-ipa-check
          unzip -q "$CM_BUILD_DIR/publish/RevierAI.ipa" -d /tmp/revierai-ipa-check

          APP_PLIST=$(find /tmp/revierai-ipa-check/Payload -maxdepth 2 -name Info.plist | head -n 1)

          if [ -z "$APP_PLIST" ]; then
            echo "Info.plist was not found inside the IPA."
            exit 1
          fi

          ACTUAL_BUILD_NUMBER=$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST"
          )
          ACTUAL_APP_VERSION=$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST"
          )

          echo "IPA version: $ACTUAL_APP_VERSION"
          echo "IPA build number: $ACTUAL_BUILD_NUMBER"
          echo "Expected build number: $APP_BUILD_NUMBER"

          if [ "$ACTUAL_BUILD_NUMBER" != "$APP_BUILD_NUMBER" ]; then
            echo "The IPA contains the wrong build number. Publishing is stopped."
            exit 1
          fi

          ls -lh "$CM_BUILD_DIR/publish/RevierAI.ipa"

    artifacts:
      - publish/RevierAI.ipa
      - /tmp/xcodebuild_logs/*.log
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
