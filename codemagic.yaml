workflows:
  ios-testflight:
    name: "RevierAI – iOS TestFlight"
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: revierai-apple

    environment:
      node: 22
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: at.revierai.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    cache:
      cache_paths:
        - "$HOME/.npm"

    scripts:
      - name: Projektstruktur prüfen
        script: |
          set -euo pipefail
          pwd
          ls -la
          test -f package.json
          test -f capacitor.config.ts
          test -d www
          test -f www/index.html

      - name: Node-Abhängigkeiten installieren
        script: |
          set -euo pipefail
          node --version
          npm --version

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npx cap --version

      - name: iOS-Projekt mit Swift Package Manager erzeugen
        script: |
          set -euo pipefail
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios

          test -d ios/App/App.xcodeproj
          test -f ios/App/App/Info.plist

          find ios/App -maxdepth 3 -type f | sort

      - name: App-Icon einsetzen
        script: |
          set -euo pipefail

          if [ -f scripts/install-ios-icon.sh ] && [ -f resources/icon-1024.png ]; then
            chmod +x scripts/install-ios-icon.sh
            scripts/install-ios-icon.sh
          else
            echo "Eigenes Icon-Skript nicht gefunden. Standardicon wird verwendet."
          fi

      - name: iPhone-Berechtigungen eintragen
        script: |
          set -euo pipefail
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string RevierAI benötigt die Kamera zum Erfassen von Wildbeobachtungen und Trophäen." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string RevierAI benötigt Zugriff auf ausgewählte Wild- und Wildkamerafotos." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string RevierAI darf von dir erstellte Bilder in der Fotomediathek speichern." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string RevierAI verwendet deinen Standort zum Speichern von Beobachtungs- und Revierpunkten." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string RevierAI benötigt das Mikrofon nur für freiwillige Spracheingaben." "$PLIST" 2>/dev/null || true

      - name: Signierung einrichten
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Buildnummer setzen
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: IPA für TestFlight bauen
        script: |
          set -euo pipefail
          xcode-project build-ipa             --project "$CM_BUILD_DIR/$XCODE_PROJECT"             --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
