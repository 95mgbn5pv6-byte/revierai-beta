workflows:
  ios-internal-testflight:
    name: RevierAI – internes TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: revierai-apple

environment:
  node: 22
  xcode: 26.4
  ios_signing:
    distribution_type: app_store
    bundle_identifier: at.revierai.app
  vars:
    XCODE_PROJECT: "ios/App/App.xcodeproj"
    XCODE_SCHEME: "App"

scripts:
  - name: Node-Abhängigkeiten installieren
    script: npm install

  - name: iOS-Projekt erzeugen und synchronisieren
    script: |
      set -euxo pipefail

      rm -rf ios

      npx cap add ios --packagemanager SPM
      npx cap sync ios

      echo "Erzeugte Projektdateien:"
      find ios -maxdepth 3 -type f | sort

  - name: App-Icon einsetzen
    script: |
      chmod +x scripts/install-ios-icon.sh
      scripts/install-ios-icon.sh

  - name: iPhone-Berechtigungen eintragen
    script: |
      PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"

      /usr/libexec/PlistBuddy \
        -c "Add :NSCameraUsageDescription string RevierAI benötigt die Kamera zum Erfassen von Wildbeobachtungen und Trophäen." \
        "$PLIST" 2>/dev/null || true

      /usr/libexec/PlistBuddy \
        -c "Add :NSPhotoLibraryUsageDescription string RevierAI benötigt Zugriff auf ausgewählte Wild- und Wildkamerafotos." \
        "$PLIST" 2>/dev/null || true

      /usr/libexec/PlistBuddy \
        -c "Add :NSLocationWhenInUseUsageDescription string RevierAI verwendet deinen Standort zum Speichern von Beobachtungs- und Revierpunkten." \
        "$PLIST" 2>/dev/null || true

  - name: Signierung einrichten
    script: xcode-project use-profiles

  - name: Buildnummer setzen
    script: |
      cd ios/App
      agvtool new-version -all "$BUILD_NUMBER"

  - name: IPA bauen
    script: |
      cd ios/App

      xcode-project build-ipa \
        --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
        --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  ios-external-testflight:
    name: RevierAI – externes TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: revierai-apple
