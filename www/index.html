<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07100b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>RevierAI Beta</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" type="button" data-route="home" aria-label="Startseite">
        <span class="brand-mark"><img src="app-icon.png" alt=""></span>
        <span class="brand-copy"><strong>RevierAI</strong><small>Beta 0.1 · lokal</small></span>
      </button>
      <div class="top-actions">
        <span id="networkBadge" class="status-pill">Prüfe Verbindung …</span>
        <button id="quickAddButton" class="icon-button" type="button" aria-label="Neue Beobachtung">＋</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button type="button" data-route="home"><span>⌂</span><small>Start</small></button>
      <button type="button" data-route="map"><span>⌖</span><small>Karte</small></button>
      <button type="button" data-route="observe"><span>＋</span><small>Eintrag</small></button>
      <button type="button" data-route="profiles"><span>♜</span><small>Wild</small></button>
      <button type="button" data-route="more"><span>☷</span><small>Mehr</small></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-handle"></div>
      <div id="modalContent"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/ai/tf.min.js"></script>
  <script src="vendor/ai/mobilenet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
